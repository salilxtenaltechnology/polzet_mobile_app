name: polzet_mobile_app
description: A new Flutter project


environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  email_auth: ^2.0.0
  collection: ^1.18.0
  http: ^1.3.0
  shared_preferences: ^2.5.1
  sizer: ^2.0.15

  pinput: ^3.0.1   # ✅ Corrected placement

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  # Ensure the file exists in this path
  adaptive_icon_background: "#ffffff"  # Background color (you can use an image too)
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
