name: polzet_mobile_app
description: A new Flutter project
version: 2.0.5+39

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  collection: ^1.18.0
  http: ^1.3.0
  shared_preferences: ^2.5.1
  flutter_screenutil: ^5.9.3
  feather_icons: ^1.2.0
  page_transition: ^2.2.1
  provider: ^6.1.4
  fluttertoast: ^9.0.0
  curved_navigation_bar: ^1.0.6
  dotted_line: ^3.2.3
  dotted_border: ^3.1.0
  lottie: ^3.3.1
  connectivity_plus: ^7.0.0
  dio: ^5.8.0+1
  shimmer: ^3.0.0
  country_picker: ^2.0.27
  country_code_picker: ^3.3.0
  font_awesome_flutter: ^10.8.0
  glass: ^2.0.0+2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

  flutter_localizations:
    sdk: flutter
  image: ^4.5.4
  http_parser: ^4.1.2
  local_auth: ^3.0.0
  image_cropper: ^11.0.0
  icons_plus: ^5.0.0
  url_launcher: ^6.3.2
  local_auth_android: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_app.png"  # Ensure the file exists in this path
  adaptive_icon_background: "#ffffff"  # Background color (you can use an image too)
  adaptive_icon_foreground: "assets/images/ic_app.png"

flutter: 
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/constants
  filename: app_images.dart
